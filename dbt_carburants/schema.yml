version: 2

models:
  - name: silver_stations
    description: "Une ligne par station, avec ses informations les plus récentes."
    columns:
      - name: id
        description: "Identifiant de la station"
        tests:
          - unique
          - not_null
      - name: latitude
        tests:
          - not_null
      - name: longitude
        tests:
          - not_null

  - name: silver_prices
    description: "Un prix par station, par carburant et par jour de snapshot."
    columns:
      - name: station_id
        tests:
          - not_null
          - relationships:
              to: ref('silver_stations')
              field: id
              config:
                severity: warn  # signale les prix de stations absentes de silver_stations (sans GPS)
      - name: snapshot_date
        tests:
          - not_null
      - name: carburant
        tests:
          - not_null
          - accepted_values:
              values: ['gazole', 'sp95', 'sp98', 'e10', 'e85', 'gplc']
      - name: prix
        tests:
          - not_null

  - name: gold_prix_quotidien_dept
    description: "Prix moyen et médian par jour, département et carburant (série temporelle)."
    columns:
      - name: snapshot_date
        tests:
          - not_null
      - name: code_departement
        tests:
          - not_null
      - name: carburant
        tests:
          - not_null
          - accepted_values:
              values: ['gazole', 'sp95', 'sp98', 'e10', 'e85', 'gplc']
      - name: prix_moyen
        tests:
          - not_null